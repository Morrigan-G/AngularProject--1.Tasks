@if(isAddingComment){
<app-add-comment [userId]="userId" (close)="onCloseComment()" />

}

<section>
  <header id="tasks">
    <h2>{{ name }}</h2>
    <menu>
      <button (click)="onAddComment()">Add comment</button>
    </menu>
  </header>

  <ul>
    @for (task of selectedUserTasks; track task.id){
    <li>
      <app-task [task]="task" />
    </li>
    }
  </ul>
</section>
