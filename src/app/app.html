@if(selectedGroupQuote){
<app-header
  [song]="selectedGroupQuote.song"
  [quote]="selectedGroupQuote.quote"
/>
}

<main>
  <ul id="names">
    @for(groupName of musicGroups;track groupName.id){

    <li>
      <app-names
        [user]="groupName"
        [selected]="groupName.id === selectedGroupId"
        (taskSelected)="onSelectGroup($event)"
      />
    </li>
    }
  </ul>

  @if(selectedMusicGroup){
  <app-tasks
    [userId]="selectedMusicGroup.id"
    [name]="selectedMusicGroup.name"
  />
  } @else {
  <p id="fallback">Select group to see content</p>
  }
</main>
<router-outlet />
